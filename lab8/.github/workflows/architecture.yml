name: FleetFlow final product
on: [push, pull_request, workflow_dispatch]
jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-lock.txt
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python verification/pipeline.py
      - run: python verification/negative_pipeline.py
      - run: python verification/live_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fleetflow-evidence
          path: verification/
